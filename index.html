<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!-- Content-Security-Policy: only this site's own scripts and Google's sign-in script may run, and the page may only talk to Google and
     your Worker. If your Worker is on a custom domain, add it to connect-src. To lock it down further, replace https://*.workers.dev with
     your exact Worker address. GitHub Pages cannot send headers, so this meta tag is the way to set it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/ https://ballast-api.ballast-site.workers.dev; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Ballast: portfolio companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/extra.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Ballast</div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="title">Overview</h1><div class="meta" id="meta"></div></div>
      <div class="row"><button class="btn" data-a="go" data-v="data">Import statement</button></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="gate" id="gate" hidden></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/config.js"></script>
<script src="js/lib-core.js"></script>
<script src="js/lib-analysis.js"></script>
<script src="js/lib-secure.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
<script src="js/views-history.js"></script>
<script src="js/views-research.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
